    <meta name="description" content="AlfredWorks reads FIDIC, NHAI, PWD and Metro Rail contracts, maps every obligation to the P6 schedule, and alerts the team before a deadline is missed or a claim is lost." />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- LinkedIn Insight Tag (Deferred) -->
    <script type="text/javascript">
      _linkedin_partner_id = "9290042";
      window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
      window._linkedin_data_partner_ids.push(_linkedin_partner_id);
      window.addEventListener('load', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(initLinkedIn);
        } else {
          setTimeout(initLinkedIn, 3000);
        }
        function initLinkedIn() {
          if (!window.lintrk) {
            window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
            window.lintrk.q=[];
          }
          var b = document.createElement("script");
          b.type = "text/javascript"; b.async = true;
          b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
          document.body.appendChild(b);
        }
      });
    </script>
    <noscript>
      <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=9290042&fmt=gif" />
    </noscript>
  </body>
