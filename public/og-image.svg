<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AlfredWorks. Every obligation in your contract, tracked from bid to handover.">
  <!--
    Source of truth for public/og-image.png (1200x630).
    Re-render with scripts/render-brand-assets.sh

    Deliberately uses the wordmark only, never the "A" monogram: identity
    handoff 5.3 prohibits it. The wordmark is positioned so the 600px
    horizontal midpoint falls inside "AlfredWorks" and the accent rule spans
    the full mark, so cropping the right half cannot yield a usable
    standalone "Alfred" logo (identity handoff 9.2 crop test).
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="100%" stop-color="#12293F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>

  <!-- Accent edge -->
  <rect x="0" y="0" width="14" height="630" fill="#FFC20E"/>

  <!-- Eyebrow -->
  <text x="80" y="150"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="23" font-weight="600" letter-spacing="4.5" fill="#FFC20E">CONTRACT INTELLIGENCE</text>

  <!-- Wordmark -->
  <text x="78" y="300"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-2" fill="#FFFFFF">AlfredWorks</text>

  <!-- Full-width rule under the mark: breaks visibly under any crop -->
  <rect x="80" y="330" width="522" height="7" rx="3.5" fill="#FFC20E"/>

  <!-- Headline -->
  <text x="80" y="430"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="41" font-weight="500" fill="#D7E2EE">Every obligation in your contract,</text>
  <text x="80" y="484"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="41" font-weight="500" fill="#D7E2EE">tracked from bid to handover.</text>

  <!-- Footer -->
  <text x="80" y="566"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="500" letter-spacing="0.4" fill="#8FA6BE">alfredworks.ai</text>
  <text x="1120" y="566" text-anchor="end"
        font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="500" letter-spacing="0.4" fill="#8FA6BE">FIDIC · NHAI · Metro Rail</text>
</svg>
